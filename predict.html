<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heart Disease Prediction</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">
 ❤️ CardioPredict
</div>

<ul>

<li><a href="/">Home</a></li>

<li><a href="/predict">Prediction</a></li>

<li><a href="/about">About</a></li>

<li><a href="/contact">Contact</a></li>

</ul>

</nav>

<section class="prediction">

<h1>Heart Disease Prediction</h1>

<form action="/result" method="POST">

<div class="form-grid">

<input type="number" name="age" placeholder="Age" required>

<select name="sex" required>

<option value="">Gender</option>

<option value="1">Male</option>

<option value="0">Female</option>

</select>

<select name="cp" required>

<option value="">Chest Pain Type</option>

<option value="0">Typical Angina</option>

<option value="1">Atypical Angina</option>

<option value="2">Non-Anginal Pain</option>

<option value="3">Asymptomatic</option>

</select>

<input type="number" name="trestbps"
placeholder="Resting Blood Pressure" required>

<input type="number" name="chol"
placeholder="Cholesterol" required>

<select name="fbs">

<option value="0">Fasting Blood Sugar <120</option>

<option value="1">Fasting Blood Sugar >120</option>

</select>

<select name="restecg">

<option value="0">Normal ECG</option>

<option value="1">ST-T Wave Abnormality</option>

<option value="2">Left Ventricular Hypertrophy</option>

</select>

<input type="number" name="thalach"
placeholder="Maximum Heart Rate">

<select name="exang">

<option value="0">No Exercise Angina</option>

<option value="1">Exercise Angina</option>

</select>

<input type="number"
step="0.1"
name="oldpeak"
placeholder="Old Peak">

<select name="slope">

<option value="0">Upsloping</option>

<option value="1">Flat</option>

<option value="2">Downsloping</option>

</select>

<input type="number"
name="ca"
placeholder="Major Vessels (0-3)">

<select name="thal">

<option value="1">Normal</option>

<option value="2">Fixed Defect</option>

<option value="3">Reversible Defect</option>

</select>

</div>

<button class="btn">

Predict Disease

</button>

</form>

</section>

</body>

</html>
